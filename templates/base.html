<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}HamfuHuddle{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>

<header class="main-header">
    <div class="header-container">

        <div class="logo-section">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="logo-img">
            <h1 class="logo-text">
                <span class="logo-h">H</span>amfu<span class="logo-h">H</span>uddle
            </h1>
        </div>

        <a href="/login" class="btn-outline">
            Iniciar sesión
            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none">
                <path d="M5 12h14M13 6l6 6-6 6"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>
            </svg>
        </a>

    </div>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
